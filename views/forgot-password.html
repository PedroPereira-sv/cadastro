<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recuperar senha</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f4; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .box { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 0 10px #ccc; width: min(320px, calc(100% - 60px)); }
    input, button { box-sizing: border-box; width: 100%; padding: 10px; margin-top: 10px; border-radius: 6px; border: 1px solid #ccc; }
    button { background: #2563eb; color: white; cursor: pointer; }
    a { display: block; margin-top: 10px; text-align: center; color: #2563eb; }
  </style>
</head>
<body>
  <main class="box">
    <h1>Recuperar senha</h1>
    <p>Informe seu e-mail. Se houver uma conta com esse endereço, enviaremos um link para criar outra senha.</p>
    <form action="/esqueci-senha" method="POST">
      <input type="email" name="email" placeholder="E-mail" autocomplete="email" required />
      <button type="submit">Enviar link</button>
    </form>
    <p id="message" role="status"></p>
    <a href="/">Voltar para o login</a>
  </main>
  <script>
    if (new URLSearchParams(window.location.search).has('enviado')) {
      document.getElementById('message').textContent = 'Se o e-mail estiver cadastrado, você receberá um link de recuperação.';
    }
  </script>
</body>
</html>
