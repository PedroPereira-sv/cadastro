<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Criar nova senha</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f4; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .box { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 0 10px #ccc; width: min(320px, calc(100% - 60px)); }
    input, button { box-sizing: border-box; width: 100%; padding: 10px; margin-top: 10px; border-radius: 6px; border: 1px solid #ccc; }
    button { background: #2563eb; color: white; cursor: pointer; }
    a { display: block; margin-top: 10px; text-align: center; color: #2563eb; }
  </style>
</head>
<body>
  <main class="box">
    <h1>Criar nova senha</h1>
    <form action="/redefinir-senha" method="POST" id="reset-form">
      <input type="hidden" name="token" id="token" />
      <input type="password" name="senha" placeholder="Nova senha (mínimo 8 caracteres)" minlength="8" autocomplete="new-password" required />
      <input type="password" name="confirmarSenha" placeholder="Confirme a nova senha" minlength="8" autocomplete="new-password" required />
      <button type="submit">Salvar nova senha</button>
    </form>
    <p id="message" role="status"></p>
    <a href="/esqueci-senha">Solicitar outro link</a>
  </main>
  <script>
    const token = new URLSearchParams(window.location.search).get('token');
    document.getElementById('token').value = token || '';
    if (!token) {
      document.getElementById('message').textContent = 'Link inválido ou incompleto. Solicite outro link.';
    }
  </script>
</body>
</html>
